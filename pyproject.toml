[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vk-capsule-mini-extended"
version = "0.2.0"
description = "Assistant companion, interactive Capsule menu and device simulator"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "httpx>=0.27,<1", "pydantic-settings>=2.6,<3", "typer>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
ai = ["google-genai>=1.0,<3"]
voice = ["vosk>=0.3.45,<1"]
hardware = ["pyusb>=1.2,<2", "pyserial>=3.5,<4"]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML", "playwright>=1.48,<2"]

[project.scripts]
capsulectl = "capsule.cli:app"
capsule-client = "capsule.client:main"

[tool.setuptools.packages.find]
include = ["capsule*"]

[tool.setuptools.package-data]
capsule = ["web/*", "data/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
